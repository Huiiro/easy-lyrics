name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:app

  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            args: --x64
            artifact: win
          - os: macos-15-intel
            target: mac
            args: --x64
            artifact: mac-x64
          - os: macos-latest
            target: mac
            args: --arm64
            artifact: mac-arm64
          - os: ubuntu-latest
            target: linux
            args: --x64
            artifact: linux
    runs-on: ${{ matrix.os }}
    env:
      SIGN_LINK: ${{ matrix.target == 'mac' && secrets.MAC_CSC_LINK || secrets.WIN_CSC_LINK }}
      SIGN_PASSWORD: ${{ matrix.target == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
      NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
      NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
      - run: npm ci
      - run: npm run build:app
      - name: Configure available signing credentials
        shell: bash
        run: |
          if [ -n "$SIGN_LINK" ]; then
            echo "CSC_LINK=$SIGN_LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$SIGN_PASSWORD" >> "$GITHUB_ENV"
          fi
          if [ "${{ matrix.target }}" = "mac" ] && [ -n "$NOTARY_APPLE_ID" ]; then
            echo "APPLE_ID=$NOTARY_APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$NOTARY_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$NOTARY_TEAM_ID" >> "$GITHUB_ENV"
          fi
      - name: Package application
        shell: bash
        run: |
          set +e
          npx electron-builder --${{ matrix.target }} ${{ matrix.args }} --publish never 2>&1 | tee electron-builder.log
          build_status=${PIPESTATUS[0]}
          if [ "$build_status" -ne 0 ]; then
            message="$(tail -80 electron-builder.log)"
            message="${message//'%'/'%25'}"
            message="${message//$'\r'/'%0D'}"
            message="${message//$'\n'/'%0A'}"
            echo "::error title=electron-builder failed::$message"
          fi
          exit "$build_status"
      - name: Verify macOS application signatures
        if: matrix.target == 'mac'
        run: |
          find dist -type d -name '*.app' -prune -print0 | while IFS= read -r -d '' app; do
            codesign --verify --deep --strict --verbose=2 "$app"
          done
      - name: Smoke test macOS applications
        if: matrix.target == 'mac'
        run: |
          find dist -type d -name '*.app' -prune -print0 | while IFS= read -r -d '' app; do
            user_data_dir="$(mktemp -d "$RUNNER_TEMP/lyric-timeline-smoke.XXXXXX")"
            "$app/Contents/MacOS/Lyric Timeline" --disable-gpu --user-data-dir="$user_data_dir" &
            app_pid=$!
            sleep 10
            kill -0 "$app_pid"
            kill "$app_pid"
            wait "$app_pid" || true
          done
      - name: Install and smoke test Windows application
        if: matrix.target == 'win'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          try {
            $installer = Get-ChildItem "dist/*-windows-x64.exe" | Select-Object -First 1
            if (-not $installer) {
              throw "Windows installer was not generated"
            }
            $installerProcess = Start-Process $installer.FullName -ArgumentList "/S" -PassThru -Wait
            if ($installerProcess.ExitCode -ne 0) {
              throw "Installer exited with code $($installerProcess.ExitCode)"
            }
            $programsDir = Join-Path $env:LOCALAPPDATA "Programs"
            $installedExecutable = Get-ChildItem $programsDir -Filter "lyric-timeline.exe" -Recurse -File | Select-Object -First 1
            if (-not $installedExecutable) {
              $installedFiles = (Get-ChildItem $programsDir -Recurse -File | Select-Object -ExpandProperty FullName) -join ", "
              throw "Installed application executable was not found under $programsDir. Files: $installedFiles"
            }
            $userDataDir = Join-Path $env:RUNNER_TEMP "lyric-timeline-smoke"
            $process = Start-Process $installedExecutable.FullName -ArgumentList "--user-data-dir=$userDataDir" -PassThru
            Start-Sleep -Seconds 10
            if ($process.HasExited) {
              throw "Installed application exited unexpectedly with code $($process.ExitCode)"
            }
            Stop-Process -Id $process.Id -Force
          } catch {
            $message = $_.Exception.Message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows installed smoke test failed::$message"
            throw
          }
      - uses: actions/upload-artifact@v4
        with:
          name: lyric-timeline-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
            dist/latest*.yaml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lyric-timeline-*
          path: release-artifacts
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release-artifacts/* --generate-notes --verify-tag
